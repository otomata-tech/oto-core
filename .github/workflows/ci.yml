name: CI

# oto-core est une lib pinnée par tag dans oto-backend. Sans CI, une casse ne se
# voyait qu'au bump du tag côté backend. Ce job teste à chaque PR/push.
# Cf. otomata-private#39 (revue CI/CD, #5).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (+ anonymize extra pour le chemin faker)
        run: pip install -e ".[anonymize]" pytest
      - name: Tests
        run: pytest -q
