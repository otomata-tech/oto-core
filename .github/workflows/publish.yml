name: Publish (PyPI)

# Publie oto-core sur PyPI à chaque version — décision du 2026-09-12 : « publier seul
# à chaque version ». Mécanisme repris d'o-browser (.github/workflows/publish.yml).
#
# Trusted publishing (OIDC) : AUCUN jeton stocké. PyPI fait confiance à ce dépôt et à
# ce NOM DE FICHIER. Enregistrement unique côté PyPI :
#   https://pypi.org/manage/project/oto-core/settings/publishing/
#   Owner: otomata-tech · Repository: oto-core · Workflow: publish.yml · Environment: (vide)
# ⚠️ Renommer ce fichier coupe la publication : PyPI lit ce nom dans le jeton OIDC.
#
# Deux déclencheurs, parce qu'un tag n'arrive pas toujours par un push :
# - push d'un tag `v*` (tag posé en local puis poussé) ;
# - workflow_dispatch avec `tag` : un tag posé par tag-release.yml (GITHUB_TOKEN) ne
#   déclenche AUCUN workflow `push`, donc tag-release.yml dispatche celui-ci ; et un tag
#   plus ancien que ce fichier ne le porte pas (rattrapage :
#   `gh workflow run publish.yml --ref main -f tag=vX.Y.Z`).
#
# Deux jobs : la construction exécute du code tiers (setuptools tiré de PyPI) et ne peut
# PAS obtenir de jeton OIDC ; seul `publish` a `id-token: write`.
# Une version déjà présente sur PyPI fait échouer l'upload (400) : voulu, jamais `skip-existing`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag EXISTANT à publier (ex: v1.126.0)"
        required: true

permissions: {}

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Construire et vérifier tag == version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Résoudre le tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag invalide '$TAG' (attendu vX.Y.Z)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Checkout du TAG, jamais de la branche : un tag absent fait échouer ici.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build (sdist + wheel)
        run: |
          python -m pip install --upgrade build
          python -m build

      # La version se lit dans le pyproject ET dans les artefacts construits : un tag
      # v1.127.0 sur un code resté à 1.126.0 échoue ici, il ne publie pas 1.126.0.
      - name: Vérifier tag == version (pyproject, sdist, roue)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, tarfile, tomllib, zipfile
          from email.parser import HeaderParser

          attendue = os.environ["TAG"].removeprefix("v")
          erreurs = []

          def verdict():
              if erreurs:
                  for e in erreurs:
                      print(f"::error::tag v{attendue} ≠ {e}")
                  sys.exit(1)

          py = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if py != attendue:
              erreurs.append(f"pyproject version={py}")
          dist = sorted(pathlib.Path("dist").iterdir())
          roues = [p for p in dist if p.suffix == ".whl"]
          sdists = [p for p in dist if p.name.endswith(".tar.gz")]
          if len(roues) != 1 or len(sdists) != 1 or len(dist) != 2:
              erreurs.append(f"dist/ attendu = 1 roue + 1 sdist, trouvé {[p.name for p in dist]}")
          verdict()
          for roue in roues:
              with zipfile.ZipFile(roue) as z:
                  meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
                  v = HeaderParser().parsestr(z.read(meta).decode())["Version"]
              if v != attendue:
                  erreurs.append(f"{roue.name} Version={v}")
          for sd in sdists:
              with tarfile.open(sd) as t:
                  info = next(m for m in t.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
                  v = HeaderParser().parsestr(t.extractfile(info).read().decode())["Version"]
              if v != attendue:
                  erreurs.append(f"{sd.name} Version={v}")
          verdict()
          print(f"OK : tag, pyproject, sdist et roue = {attendue} → {[p.name for p in dist]}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publier sur PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # requis pour le trusted publishing OIDC — et rien d'autre
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish ${{ needs.build.outputs.tag }} to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
